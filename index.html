<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Interactive Personal Blog Platform</title>
</head>
<body>
    <main id="main">
        <form id="blogForm" novalidate>
        <input id="blogTitle" type="text" placeholder="Blog Title" required>
        <span class="error-message" id="blogTitleError"></span>
        <textarea name="blog-content" id="blogContent" rows="10" cols="50" placeholder="Enter Blog Content.." required></textarea>
        <span class="error-message" id="blogContentError"></span>
        <button type="submit" id="addBlogBtn">Submit</button>

            <h1>New Blog Posts</h1>
            <ul id="blogList"></ul>
        </form>
    </main>


<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit Blog Post</h2>
      <form id="editForm" novalidate>
        <input id="editBlogTitle" type="text" placeholder="Blog Title" required>
        <span class="error-message" id="editBlogTitleError"></span>
        
        <textarea id="editBlogContent" rows="10" cols="50" placeholder="Enter Blog Content.." required></textarea>
        <span class="error-message" id="editBlogContentError"></span>
        
        <button type="submit" id="updateBlogBtn">Update Blog</button>
        <button type="button" id="cancelEditBtn">Cancel</button>
      </form>
    </div>
  </div>
  
    <script src="script.js"></script>
</body>
</html>
